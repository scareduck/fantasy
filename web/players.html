<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fantasy FA Browser</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  font-size: 13px;
  background: #e8eaed;
  color: #202124;
  min-height: 100vh;
}

header {
  background: #1a73e8;
  color: #fff;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
}
header h1 { font-size: 17px; font-weight: 600; }
header .spacer { flex: 1; }
header span { font-size: 12px; opacity: 0.8; }
header a { color: #fff; font-size: 13px; font-weight: 500; text-decoration: none; white-space: nowrap; }
header a:hover { text-decoration: underline; }

.tabs {
  display: flex;
  gap: 2px;
  padding: 10px 16px 0;
  background: #e8eaed;
}
.tab {
  padding: 7px 20px;
  border: 1px solid #bdc1c6;
  border-bottom: none;
  border-radius: 6px 6px 0 0;
  cursor: pointer;
  background: #dadce0;
  font-weight: 500;
  color: #5f6368;
  transition: background 0.1s;
}
.tab:hover { background: #ececec; }
.tab.active { background: #fff; color: #1a73e8; border-color: #dadce0; }

.panel {
  background: #fff;
  border: 1px solid #dadce0;
  border-top: none;
}

/* filter bar */
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
  align-items: center;
  padding: 10px 14px;
  border-bottom: 1px solid #ebebeb;
  background: #fafafa;
}
.fg { display: flex; align-items: center; gap: 5px; }
.fg > label:first-child {
  font-size: 11px; color: #5f6368; white-space: nowrap;
  font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px;
}
.fg input[type=number] {
  width: 64px; padding: 4px 6px;
  border: 1px solid #ccc; border-radius: 4px;
  font-size: 12px; color: #202124;
}
.fg input[type=number]:focus { outline: none; border-color: #1a73e8; }
.fg input[type=checkbox],
.fg input[type=radio] { cursor: pointer; }
.fg .opt { display: flex; align-items: center; gap: 3px; font-size: 12px; color: #3c4043; }
.filter-sep { color: #dadce0; font-size: 18px; line-height: 1; }
.btn-reset {
  padding: 4px 10px; font-size: 11px; font-weight: 500;
  background: none; border: 1px solid #ccc; border-radius: 4px;
  cursor: pointer; color: #5f6368;
  margin-left: auto;
}
.btn-reset:hover { background: #f0f0f0; }
.btn-pag {
  padding: 2px 8px; font-size: 13px;
  background: none; border: 1px solid #ccc; border-radius: 4px;
  cursor: pointer; color: #5f6368;
}
.btn-pag:hover:not(:disabled) { background: #f0f0f0; }
.btn-pag:disabled { opacity: 0.35; cursor: default; }

/* table */
.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
thead th {
  position: sticky; top: 0; z-index: 1;
  background: #f1f3f4;
  padding: 7px 10px;
  text-align: left;
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.4px;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
  border-bottom: 2px solid #dadce0;
  color: #5f6368;
}
thead th:hover { background: #e8eaed; color: #202124; }
thead th.sort-asc  { color: #1a73e8; }
thead th.sort-asc::after  { content: ' ↑'; }
thead th.sort-desc { color: #1a73e8; }
thead th.sort-desc::after { content: ' ↓'; }

tbody td {
  padding: 5px 10px;
  border-bottom: 1px solid #f1f1f1;
  white-space: nowrap;
}
tbody tr:hover td { background: #f8f9ff; }
tbody tr:last-child td { border-bottom: none; }

.num { text-align: right; font-variant-numeric: tabular-nums; }

.st-il  { color: #c5221f; font-weight: 600; font-size: 11px; }
.st-na  { color: #e37400; font-weight: 600; font-size: 11px; }
.st-ok  { color: #188038; font-size: 11px; }
.av-fa  { color: #188038; font-size: 11px; font-weight: 600; }
.av-w   { color: #e37400; font-size: 11px; font-weight: 600; }

.name-cell { min-width: 140px; }
.pos-cell  { color: #5f6368; }

tbody td a { color: #1a73e8; text-decoration: none; }
tbody td a:hover { text-decoration: underline; }
.stats-link { font-size: 11px; color: #5f6368; }

.footer {
  padding: 6px 14px;
  font-size: 11px;
  color: #80868b;
  border-top: 1px solid #ebebeb;
  background: #fafafa;
  display: flex;
  justify-content: space-between;
}

.msg { padding: 40px; text-align: center; color: #5f6368; font-size: 14px; }
.msg.err { color: #c5221f; }
</style>
</head>
<body>

<header>
  <h1>Fantasy Free Agent Browser</h1>
  <div class="spacer"></div>
  <span id="as-of"></span>
  <a href="index.html">&#8592; Home</a>
</header>

<div class="tabs">
  <div class="tab active" data-tab="batters">Batters</div>
  <div class="tab"        data-tab="pitchers">Pitchers</div>
  <div class="tab"        data-tab="sp1">1-Start</div>
  <div class="tab"        data-tab="sp2">2-Start</div>
</div>

<div class="panel">

  <!-- batter filters -->
  <div class="filters" id="filt-batters">
    <div class="fg"><label>Min AB</label>  <input type="number" id="b-ab"  value="20" min="0" step="5"></div>
    <div class="fg"><label>Min OBP</label> <input type="number" id="b-obp" value=""   min="0" max="1"   step="0.001" placeholder=".000"></div>
    <div class="fg"><label>Min HR</label>  <input type="number" id="b-hr"  value=""   min="0" step="1"></div>
    <div class="fg"><label>Min RBI</label> <input type="number" id="b-rbi" value=""   min="0" step="1"></div>
    <div class="fg"><label>Min SB</label>  <input type="number" id="b-sb"  value=""   min="0" step="1"></div>
    <div class="filter-sep">|</div>
    <div class="fg"><label>Max %Own</label><input type="number" id="b-own" value=""   min="0" max="100" step="1"></div>
    <div class="filter-sep">|</div>
    <div class="fg">
      <label>Pos</label>
      <label class="opt"><input type="radio" name="b-pos" value=""     checked> Any</label>
      <label class="opt"><input type="radio" name="b-pos" value="C">    C</label>
      <label class="opt"><input type="radio" name="b-pos" value="1B">   1B</label>
      <label class="opt"><input type="radio" name="b-pos" value="2B">   2B</label>
      <label class="opt"><input type="radio" name="b-pos" value="3B">   3B</label>
      <label class="opt"><input type="radio" name="b-pos" value="SS">   SS</label>
      <label class="opt"><input type="radio" name="b-pos" value="OF">   OF</label>
      <label class="opt"><input type="radio" name="b-pos" value="Util"> Util</label>
    </div>
    <div class="filter-sep">|</div>
    <div class="fg">
      <label>Avail</label>
      <label class="opt"><input type="radio" name="b-avail" value="FA" checked> FA</label>
      <label class="opt"><input type="radio" name="b-avail" value="W"> W</label>
      <label class="opt"><input type="radio" name="b-avail" value=""> Both</label>
    </div>
    <div class="filter-sep">|</div>
    <div class="fg"><label>IL/NA</label><select id="b-il"><option value="excl" selected>Exclude</option><option value="ignore">Ignore</option><option value="only">Filter</option></select></div>
    <div class="filter-sep">|</div>
    <div class="fg"><label>Search</label> <input type="text" id="b-search" placeholder="name or team" style="width:130px"></div>
    <button class="btn-reset" id="reset-batters">Reset</button>
  </div>

  <!-- pitcher filters -->
  <div class="filters" id="filt-pitchers" style="display:none">
    <div class="fg"><label>Min IP</label>   <input type="number" id="p-ip"   value="10" min="0" step="5"></div>
    <div class="fg"><label>Max ERA</label>  <input type="number" id="p-era"  value=""   min="0" max="30"  step="0.1"></div>
    <div class="fg"><label>Max WHIP</label> <input type="number" id="p-whip" value=""   min="0" max="5"   step="0.01"></div>
    <div class="fg"><label>Min K</label>    <input type="number" id="p-k"    value=""   min="0" step="1"></div>
    <div class="fg"><label>Min W</label>    <input type="number" id="p-w"    value=""   min="0" step="1"></div>
    <div class="filter-sep">|</div>
    <div class="fg"><label>Max %Own</label> <input type="number" id="p-own"  value=""   min="0" max="100" step="1"></div>
    <div class="filter-sep">|</div>
    <div class="fg">
      <label>Role</label>
      <label class="opt"><input type="radio" name="p-role" value=""   checked> All</label>
      <label class="opt"><input type="radio" name="p-role" value="SP"> SP</label>
      <label class="opt"><input type="radio" name="p-role" value="RP"> RP</label>
    </div>
    <div class="filter-sep">|</div>
    <div class="fg">
      <label>Avail</label>
      <label class="opt"><input type="radio" name="p-avail" value="FA" checked> FA</label>
      <label class="opt"><input type="radio" name="p-avail" value="W"> W</label>
      <label class="opt"><input type="radio" name="p-avail" value=""> Both</label>
    </div>
    <div class="filter-sep">|</div>
    <div class="fg"><label>IL/NA</label><select id="p-il"><option value="excl" selected>Exclude</option><option value="ignore">Ignore</option><option value="only">Filter</option></select></div>
    <div class="filter-sep">|</div>
    <div class="fg"><label>Search</label> <input type="text" id="p-search" placeholder="name or team" style="width:130px"></div>
    <button class="btn-reset" id="reset-pitchers">Reset</button>
  </div>

  <!-- 1-start filters -->
  <div class="filters" id="filt-sp1" style="display:none">
    <div class="fg"><label>Min FPTS</label><input type="number" id="sp1-fpts" value="9" min="0" step="0.5"></div>
    <div class="filter-sep">|</div>
    <div class="fg"><label>Max %Own</label><input type="number" id="sp1-own" value="" min="0" max="100" step="1"></div>
    <div class="filter-sep">|</div>
    <div class="fg">
      <label>Avail</label>
      <label class="opt"><input type="radio" name="sp1-avail" value="FA" checked> FA</label>
      <label class="opt"><input type="radio" name="sp1-avail" value="W"> W</label>
      <label class="opt"><input type="radio" name="sp1-avail" value=""> Both</label>
    </div>
    <div class="filter-sep">|</div>
    <div class="fg"><label>IL/NA</label><select id="sp1-il"><option value="excl" selected>Exclude</option><option value="ignore">Ignore</option><option value="only">Filter</option></select></div>
    <div class="filter-sep">|</div>
    <div class="fg"><label>Search</label> <input type="text" id="sp1-search" placeholder="name or team" style="width:130px"></div>
    <button class="btn-reset" id="reset-sp1">Reset</button>
  </div>

  <!-- 2-start filters -->
  <div class="filters" id="filt-sp2" style="display:none">
    <div class="fg"><label>Min FPTS</label><input type="number" id="sp2-fpts" value="18" min="0" step="0.5"></div>
    <div class="filter-sep">|</div>
    <div class="fg"><label>Max %Own</label><input type="number" id="sp2-own" value="" min="0" max="100" step="1"></div>
    <div class="filter-sep">|</div>
    <div class="fg">
      <label>Avail</label>
      <label class="opt"><input type="radio" name="sp2-avail" value="FA" checked> FA</label>
      <label class="opt"><input type="radio" name="sp2-avail" value="W"> W</label>
      <label class="opt"><input type="radio" name="sp2-avail" value=""> Both</label>
    </div>
    <div class="filter-sep">|</div>
    <div class="fg"><label>IL/NA</label><select id="sp2-il"><option value="excl" selected>Exclude</option><option value="ignore">Ignore</option><option value="only">Filter</option></select></div>
    <div class="filter-sep">|</div>
    <div class="fg"><label>Search</label> <input type="text" id="sp2-search" placeholder="name or team" style="width:130px"></div>
    <button class="btn-reset" id="reset-sp2">Reset</button>
  </div>

  <div class="table-scroll">
    <table>
      <thead id="thead"></thead>
      <tbody id="tbody"><tr><td class="msg" colspan="99">Loading…</td></tr></tbody>
    </table>
  </div>

  <div class="footer">
    <span id="count-lbl"></span>
    <span id="pag-controls" style="display:flex;gap:6px;align-items:center">
      <button id="pag-prev" class="btn-pag">&#8249; Prev</button>
      <button id="pag-next" class="btn-pag">Next &#8250;</button>
    </span>
    <span id="sync-lbl"></span>
  </div>

</div>

<script>
'use strict';

function getCookie(name) {
  const m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
  return m ? decodeURIComponent(m[1]) : null;
}
function setCookie(name, value) {
  const exp = new Date();
  exp.setFullYear(exp.getFullYear() + 1);
  document.cookie = name + '=' + encodeURIComponent(value) + '; expires=' + exp.toUTCString() + '; path=/';
}

const store = { batters: null, pitchers: null, sp1: null, sp2: null };
const VALID_TABS = ['batters', 'pitchers', 'sp1', 'sp2'];
const savedTab = getCookie('players_tab');
let activeTab   = (savedTab && VALID_TABS.indexOf(savedTab) !== -1) ? savedTab : 'batters';
let sortCol     = null;
let sortDir     = 1;
let currentPage = 0;
const PAGE_SIZE = 100;

// Apply saved tab state to DOM before first render.
if (activeTab !== 'batters') {
  document.querySelectorAll('.tab').forEach(function(t) {
    t.classList.toggle('active', t.dataset.tab === activeTab);
  });
  VALID_TABS.forEach(function(t) {
    document.getElementById('filt-' + t).style.display = (t === activeTab) ? 'flex' : 'none';
  });
}

// ── Column definitions ─────────────────────────────────────────────────────

const COLS = {
  batters: [
    { key:'name',       label:'Name',  cls:'name-cell', fmt: (v, r) => addLink(v, r.player_key) },
    { key:'player_key', label:'',      noSort: true,    fmt: (v, r) => statsLink(v, r.name) },
    { key:'team',       label:'Team' },
    { key:'pos',     label:'Pos',    cls:'pos-cell' },
    { key:'status',  label:'Status', fmtClass: statusClass },
    { key:'avail',   label:'Avail',  fmtClass: availClass },
    { key:'pct_own', label:'%Own',   cls:'num', fmt: fmtOwn },
    { key:'ab',      label:'AB',     cls:'num' },
    { key:'obp',     label:'OBP',    cls:'num', fmt: v => v != null ? (+v).toFixed(3) : '' },
    { key:'r',       label:'R',      cls:'num' },
    { key:'hr',      label:'HR',     cls:'num' },
    { key:'rbi',     label:'RBI',    cls:'num' },
    { key:'sb',      label:'SB',     cls:'num' },
  ],
  pitchers: [
    { key:'name',       label:'Name', cls:'name-cell', fmt: (v, r) => addLink(v, r.player_key) },
    { key:'player_key', label:'',     noSort: true,    fmt: (v, r) => statsLink(v, r.name) },
    { key:'team',       label:'Team' },
    { key:'pos',      label:'Pos',   cls:'pos-cell' },
    { key:'status',   label:'Status',fmtClass: statusClass },
    { key:'avail',    label:'Avail', fmtClass: availClass },
    { key:'pct_own',  label:'%Own',  cls:'num', fmt: fmtOwn },
    { key:'ip',       label:'IP',    cls:'num', fmt: v => v != null ? (+v).toFixed(1) : '' },
    { key:'w',        label:'W',     cls:'num' },
    { key:'k',        label:'K',     cls:'num' },
    { key:'era',      label:'ERA',   cls:'num', fmt: v => v != null ? (+v).toFixed(2) : '' },
    { key:'whip',     label:'WHIP',  cls:'num', fmt: v => v != null ? (+v).toFixed(3) : '' },
    { key:'k9',       label:'K/9',   cls:'num', fmt: v => v != null ? (+v).toFixed(1) : '' },
    { key:'sv_holds', label:'SV+H',  cls:'num', fmt: v => v != null ? (+v).toFixed(0) : '' },
  ],
  sp1: [
    { key:'name',       label:'Name',    cls:'name-cell', fmt: (v, r) => addLink(v, r.player_key) },
    { key:'player_key', label:'',        noSort: true,    fmt: (v, r) => statsLink(v, r.name) },
    { key:'team',       label:'Team' },
    { key:'status',     label:'Status',  fmtClass: statusClass },
    { key:'avail',      label:'Avail',   fmtClass: availClass },
    { key:'pct_own',    label:'%Own',    cls:'num', fmt: fmtOwn },
    { key:'matchup',    label:'Matchup', sortVal: matchupDateVal },
    { key:'fpts',       label:'FPTS',    cls:'num', fmt: v => v != null ? (+v).toFixed(1) : '' },
    { key:'era',        label:'ERA',     cls:'num', fmt: v => v != null ? (+v).toFixed(2) : '' },
    { key:'whip',       label:'WHIP',    cls:'num', fmt: v => v != null ? (+v).toFixed(3) : '' },
    { key:'k9',         label:'K/9',     cls:'num', fmt: v => v != null ? (+v).toFixed(1) : '' },
  ],
  sp2: [
    { key:'name',       label:'Name',    cls:'name-cell', fmt: (v, r) => addLink(v, r.player_key) },
    { key:'player_key', label:'',        noSort: true,    fmt: (v, r) => statsLink(v, r.name) },
    { key:'team',       label:'Team' },
    { key:'status',     label:'Status',  fmtClass: statusClass },
    { key:'avail',      label:'Avail',   fmtClass: availClass },
    { key:'pct_own',    label:'%Own',    cls:'num', fmt: fmtOwn },
    { key:'starts',     label:'Starts', sortVal: matchupDateVal },
    { key:'fpts',       label:'Tot FPTS', cls:'num', fmt: v => v != null ? (+v).toFixed(1) : '' },
    { key:'era',        label:'ERA',     cls:'num', fmt: v => v != null ? (+v).toFixed(2) : '' },
    { key:'whip',       label:'WHIP',    cls:'num', fmt: v => v != null ? (+v).toFixed(3) : '' },
    { key:'k9',         label:'K/9',     cls:'num', fmt: v => v != null ? (+v).toFixed(1) : '' },
  ],
};

function pid(key) { return key ? key.split('.').pop() : ''; }
function addLink(name, key)  { return `<a href="https://baseball.fantasysports.yahoo.com/b1/73362/addplayer?apid=${pid(key)}" target="_blank" rel="noopener">${name}</a>`; }
function statsLink(key, name) {
  const yahoo = `<a class="stats-link" href="https://sports.yahoo.com/mlb/players/${pid(key)}/" target="_blank" rel="noopener">stats</a>`;
  const bref  = name ? ` <a class="stats-link" href="https://www.baseball-reference.com/search/search.fcgi?search=${encodeURIComponent(name)}" target="_blank" rel="noopener">b-ref</a>` : '';
  return yahoo + bref;
}

function fmtOwn(v) { return v != null ? (+v).toFixed(1) + '%' : ''; }

function statusClass(v) {
  if (!v) return '';
  if (/^IL/.test(v)) return 'st-il';
  if (v === 'NA')    return 'st-na';
  return 'st-ok';
}

function availClass(v) {
  if (v === 'FA') return 'av-fa';
  if (v === 'W')  return 'av-w';
  return '';
}

// ── Filters ────────────────────────────────────────────────────────────────

const DEFAULTS = {
  batters:  { 'b-ab': 20 },
  pitchers: { 'p-ip': 10 },
  sp1:      { 'sp1-fpts': 9 },
  sp2:      { 'sp2-fpts': 18 },
};

function resetFilters(tab) {
  currentPage = 0;
  document.querySelectorAll(`#filt-${tab} select`).forEach(el => {
    el.value = 'excl';
  });
  document.querySelectorAll(`#filt-${tab} input`).forEach(el => {
    if (el.type === 'radio') {
      // defaults: FA for avail radios, '' (Any/All) for pos and role radios
      el.checked = (el.value === 'FA') ||
                   (el.name === 'b-pos'  && el.value === '') ||
                   (el.name === 'p-role' && el.value === '');
      return;
    }
    const def = DEFAULTS[tab][el.id];
    el.value = def !== undefined ? def : '';
  });
  render();
}

function radioVal(name) {
  const el = document.querySelector(`input[name="${name}"]:checked`);
  return el ? el.value : '';
}

function getFilters(tab) {
  const g  = id => { const v = document.getElementById(id).value; return v === '' ? null : +v; };
  const gs = id => { const el = document.getElementById(id); return el ? el.value.toLowerCase().trim() : ''; };
  const il = id => document.getElementById(id).value;  // 'excl' | 'ignore' | 'only'

  if (tab === 'batters') return {
    ab:     g('b-ab') ?? 0,
    obp:    g('b-obp'),
    hr:     g('b-hr'),
    rbi:    g('b-rbi'),
    sb:     g('b-sb'),
    own:    g('b-own'),
    pos:    radioVal('b-pos'),
    avail:  radioVal('b-avail'),
    ilMode: il('b-il'),
    search: gs('b-search'),
  };
  if (tab === 'sp1' || tab === 'sp2') return {
    fptsMin: g(tab + '-fpts') ?? 0,
    own:     g(tab + '-own'),
    avail:   radioVal(tab + '-avail'),
    ilMode:  il(tab + '-il'),
    search:  gs(tab + '-search'),
  };
  return {
    ip:     g('p-ip') ?? 0,
    era:    g('p-era'),
    whip:   g('p-whip'),
    k:      g('p-k'),
    w:      g('p-w'),
    own:    g('p-own'),
    role:   radioVal('p-role'),
    avail:  radioVal('p-avail'),
    ilMode: il('p-il'),
    search: gs('p-search'),
  };
}

function passes(row, tab, f) {
  const st = row.status || '';
  const isIL = st === 'NA' || /^IL/.test(st);
  if (f.ilMode === 'excl' && isIL) return false;
  if (f.ilMode === 'only' && !isIL) return false;
  if (f.avail && row.avail !== f.avail) return false;
  if (f.own != null && row.pct_own != null && +row.pct_own > f.own) return false;
  if (f.search) {
    const haystack = ((row.name || '') + ' ' + (row.team || '')).toLowerCase();
    if (!haystack.includes(f.search)) return false;
  }

  if (tab === 'sp1' || tab === 'sp2') {
    if (f.fptsMin > 0 && (row.fpts == null || +row.fpts < f.fptsMin)) return false;
    return true;
  }

  if (tab === 'batters') {
    if (row.ab == null || +row.ab < f.ab) return false;
    if (f.obp != null && (row.obp == null || +row.obp < f.obp)) return false;
    if (f.hr  != null && (row.hr  == null || +row.hr  < f.hr))  return false;
    if (f.rbi != null && (row.rbi == null || +row.rbi < f.rbi)) return false;
    if (f.sb  != null && (row.sb  == null || +row.sb  < f.sb))  return false;
    if (f.pos) {
      const playerPos = (row.pos || '').split(',').map(p => p.trim());
      if (!playerPos.includes(f.pos)) return false;
    }
  } else {
    if (row.ip == null || +row.ip < f.ip) return false;
    if (f.era  != null && (row.era  == null || +row.era  > f.era))  return false;
    if (f.whip != null && (row.whip == null || +row.whip > f.whip)) return false;
    if (f.k    != null && (row.k    == null || +row.k    < f.k))    return false;
    if (f.w    != null && (row.w    == null || +row.w    < f.w))    return false;
    if (f.role) {
      const playerPos = (row.pos || '').split(',').map(p => p.trim());
      if (!playerPos.includes(f.role)) return false;
    }
  }
  return true;
}

// ── Render ─────────────────────────────────────────────────────────────────

function numVal(v) {
  if (v === null || v === '') return null;
  const n = +v;
  return isNaN(n) ? v : n;
}

function matchupDateVal(s) {
  if (!s) return null;
  const m = s.match(/(\d+)\/(\d+)/);
  return m ? +m[1] * 100 + +m[2] : null;
}

function render() {
  const tab  = activeTab;
  const rows = store[tab];
  if (!rows) return;

  const cols = COLS[tab];
  const f    = getFilters(tab);
  let   data = rows.filter(r => passes(r, tab, f));

  if (sortCol !== null && sortCol < cols.length) {
    const col = cols[sortCol];
    const key = col.key;
    const valFn = col.sortVal ? col.sortVal : numVal;
    data.sort((a, b) => {
      const av = valFn(a[key]), bv = valFn(b[key]);
      if (av === null && bv === null) return 0;
      if (av === null) return 1;
      if (bv === null) return -1;
      return av < bv ? -sortDir : av > bv ? sortDir : 0;
    });
  }

  // thead
  const thead = document.getElementById('thead');
  thead.innerHTML = '<tr>' + cols.map((c, i) => {
    const sc = sortCol === i ? (sortDir === 1 ? 'sort-asc' : 'sort-desc') : '';
    const cursor = c.noSort ? 'style="cursor:default"' : '';
    return `<th class="${sc}" data-i="${i}" ${cursor}>${c.label}</th>`;
  }).join('') + '</tr>';
  thead.querySelectorAll('th').forEach(th => {
    th.addEventListener('click', () => {
      const i = +th.dataset.i;
      if (cols[i].noSort) return;
      if (sortCol === i) sortDir *= -1;
      else { sortCol = i; sortDir = 1; }
      currentPage = 0;
      render();
    });
  });

  // pagination
  const filtered  = data.length;
  const pageCount = Math.max(1, Math.ceil(filtered / PAGE_SIZE));
  if (currentPage >= pageCount) currentPage = Math.max(0, pageCount - 1);
  const start    = currentPage * PAGE_SIZE;
  const end      = Math.min(start + PAGE_SIZE, filtered);
  const pageRows = data.slice(start, end);

  // tbody
  const tbody = document.getElementById('tbody');
  if (filtered === 0) {
    tbody.innerHTML = '<tr><td colspan="99" class="msg">No players match the current filters.</td></tr>';
  } else {
    tbody.innerHTML = pageRows.map(row =>
      '<tr>' + cols.map(c => {
        const raw = row[c.key];
        const val = c.fmt ? c.fmt(raw, row) : (raw == null ? '' : raw);
        const tdcls = [c.cls || '', c.fmtClass ? c.fmtClass(raw) : ''].filter(Boolean).join(' ');
        return `<td class="${tdcls}">${val}</td>`;
      }).join('') + '</tr>'
    ).join('');
  }

  const total     = rows.filter(r => f.avail ? r.avail === f.avail : true).length;
  const rangeStr  = filtered === 0 ? '0' : `${(start + 1).toLocaleString()}–${end.toLocaleString()}`;
  const totalNote = filtered < total ? ` (${total.toLocaleString()} total)` : '';
  document.getElementById('count-lbl').textContent =
    `${rangeStr} of ${filtered.toLocaleString()} players${totalNote}`;
  document.getElementById('pag-prev').disabled = currentPage === 0;
  document.getElementById('pag-next').disabled = end >= filtered;
}

// ── Data loading ───────────────────────────────────────────────────────────

async function loadTab(tab) {
  if (store[tab]) { render(); return; }

  document.getElementById('tbody').innerHTML =
    '<tr><td colspan="99" class="msg">Loading…</td></tr>';
  document.getElementById('count-lbl').textContent = '';

  try {
    const resp = await fetch(`api.php?type=${tab}`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const json = await resp.json();
    if (json.error) throw new Error(json.error);
    store[tab] = json;
    render();
  } catch (e) {
    document.getElementById('tbody').innerHTML =
      `<tr><td colspan="99" class="msg err">Error: ${e.message}</td></tr>`;
    document.getElementById('count-lbl').textContent = '';
  }
}

// ── Tabs ───────────────────────────────────────────────────────────────────

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    if (t.dataset.tab === activeTab) return;
    activeTab = t.dataset.tab;
    setCookie('players_tab', activeTab);
    sortCol = null; sortDir = 1; currentPage = 0;
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    VALID_TABS.forEach(function(t) {
      document.getElementById('filt-' + t).style.display = (t === activeTab) ? 'flex' : 'none';
    });
    loadTab(activeTab);
  });
});

// ── Filter listeners ───────────────────────────────────────────────────────

document.querySelectorAll('.filters input, .filters select').forEach(el => {
  el.addEventListener('input',  () => { currentPage = 0; render(); });
  el.addEventListener('change', () => { currentPage = 0; render(); });
});
document.getElementById('pag-prev').addEventListener('click', () => { currentPage--; render(); });
document.getElementById('pag-next').addEventListener('click', () => { currentPage++; render(); });
document.getElementById('reset-batters').addEventListener('click',  () => resetFilters('batters'));
document.getElementById('reset-pitchers').addEventListener('click', () => resetFilters('pitchers'));
document.getElementById('reset-sp1').addEventListener('click',      () => resetFilters('sp1'));
document.getElementById('reset-sp2').addEventListener('click',      () => resetFilters('sp2'));

// ── Sync timestamp ─────────────────────────────────────────────────────────

fetch('api.php?type=meta')
  .then(r => r.json())
  .then(m => {
    if (m.batter_sync) document.getElementById('as-of').textContent = `Batters as of ${m.batter_sync}`;
    document.getElementById('sync-lbl').textContent =
      `B sync: ${m.batter_sync || 'n/a'} · P sync: ${m.pitcher_sync || 'n/a'}`;
  })
  .catch(() => {});

// ── Init ───────────────────────────────────────────────────────────────────

loadTab(activeTab);
</script>
</body>
</html>
