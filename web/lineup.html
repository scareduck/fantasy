<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lineup Helper</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 13px;
  background: #e8eaed;
  color: #202124;
  min-height: 100vh;
}

header {
  background: #1a73e8;
  color: #fff;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
}
header h1 { font-size: 17px; font-weight: 600; }
header a  { color: #fff; font-size: 13px; font-weight: 500; text-decoration: none; white-space: nowrap; }
header a:hover { text-decoration: underline; }
header .spacer { flex: 1; }
header .period { font-size: 12px; opacity: 0.75; }

select#team-select {
  padding: 4px 8px;
  border: none;
  border-radius: 4px;
  font-size: 13px;
  font-weight: 600;
  background: rgba(255,255,255,0.2);
  color: #fff;
  cursor: pointer;
}
select#team-select option { background: #1558b0; color: #fff; }

.tabs {
  display: flex;
  gap: 2px;
  padding: 10px 16px 0;
  background: #e8eaed;
}
.tab {
  padding: 7px 20px;
  border: 1px solid #bdc1c6;
  border-bottom: none;
  border-radius: 6px 6px 0 0;
  cursor: pointer;
  background: #dadce0;
  font-weight: 500;
  color: #5f6368;
  transition: background 0.1s;
}
.tab:hover  { background: #ececec; }
.tab.active { background: #fff; color: #1a73e8; border-color: #dadce0; }

.panel {
  background: #fff;
  border: 1px solid #dadce0;
  border-top: none;
}

.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
thead th {
  position: sticky; top: 0; z-index: 1;
  background: #f1f3f4;
  padding: 7px 10px;
  text-align: left;
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.4px;
  white-space: nowrap;
  border-bottom: 2px solid #dadce0;
  color: #5f6368;
}
thead th.num { text-align: right; }
tbody td {
  padding: 5px 10px;
  border-bottom: 1px solid #f1f1f1;
  white-space: nowrap;
}
tbody tr:hover td { background: #f8f9ff; }
tbody tr:last-child td { border-bottom: none; }
.num { text-align: right; font-variant-numeric: tabular-nums; }

.slot {
  display: inline-block; padding: 1px 5px; border-radius: 3px;
  font-size: 10px; font-weight: 700; letter-spacing: 0.3px;
}
.slot-sp  { background: #e8f0fe; color: #1a73e8; }
.slot-rp  { background: #e6f4ea; color: #137333; }
.slot-bn  { background: #f1f3f4; color: #5f6368; }
.slot-bat { background: #fff3e0; color: #e65100; }

.fpts-hi   { color: #137333; font-weight: 700; }
.fpts-mid  { color: #1a73e8; font-weight: 600; }
.fpts-lo   { color: #5f6368; }
.fpts-none { color: #bbb; font-style: italic; }
.era-good  { color: #137333; }
.era-bad   { color: #c5221f; }

.footer {
  padding: 6px 14px; font-size: 11px; color: #80868b;
  border-top: 1px solid #ebebeb; background: #fafafa;
}

.msg { padding: 40px; text-align: center; color: #5f6368; font-size: 14px; }
.msg.err { color: #c5221f; }
</style>
</head>
<body>

<header>
  <h1>Lineup Helper</h1>
  <select id="team-select"></select>
  <div class="spacer"></div>
  <span class="period" id="period"></span>
  <a href="index.html">&#8592; Home</a>
</header>

<div class="tabs">
  <div class="tab active" data-tab="starts">Pitcher Starts</div>
  <div class="tab"        data-tab="matchups">Batter Matchups</div>
</div>

<div class="panel">
  <div class="table-scroll">
    <table>
      <thead id="thead"></thead>
      <tbody id="tbody"><tr><td class="msg" colspan="99">Loading&#8230;</td></tr></tbody>
    </table>
  </div>
  <div class="footer" id="footer"></div>
</div>

<script>
"use strict";

// cache[tab][team_key] = rows
const cache = { starts: {}, matchups: {} };

// Teams whose selection should be remembered across visits.
const OUR_TEAMS = ["469.l.73362.t.8", "469.l.73362.t.10"];

function getCookie(name) {
  const m = document.cookie.match(new RegExp("(?:^|; )" + name + "=([^;]*)"));
  return m ? decodeURIComponent(m[1]) : null;
}
function setCookie(name, value) {
  const exp = new Date();
  exp.setFullYear(exp.getFullYear() + 1);
  document.cookie = name + "=" + encodeURIComponent(value) + "; expires=" + exp.toUTCString() + "; path=/";
}

let activeTab  = "starts";
let activeTeam = "469.l.73362.t.8";

// ── Helpers ─────────────────────────────────────────────────────────────────

function fptsCls(v) {
  if (v === null) return "fpts-none";
  if (v >= 10)   return "fpts-hi";
  if (v >= 6)    return "fpts-mid";
  return "fpts-lo";
}
function eraCls(v) {
  if (v === null) return "";
  return v <= 3.5 ? "era-good" : v >= 5.0 ? "era-bad" : "";
}
function slotBadge(s, cls) {
  return `<span class="slot ${cls}">${s || ""}</span>`;
}
function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso + "T12:00:00");
  return d.toLocaleDateString("en-US", { weekday: "short", month: "numeric", day: "numeric" });
}

// ── Column definitions ───────────────────────────────────────────────────────

const COLS = {
  starts: [
    { label: "Date",    key: "start_date",
      fmt: (v)    => fmtDate(v) },
    { label: "Pitcher", key: "name" },
    { label: "MLB",     key: "mlb_team" },
    { label: "Slot",    key: "slot",
      fmt: (v, r) => slotBadge(r.slot, r.slot === "SP" ? "slot-sp" : "slot-bn") },
    { label: "Matchup", key: "start" },
    { label: "FPTS",    key: "fpts",  cls: "num",
      fmt: (v)    => `<span class="${fptsCls(v)}">${v !== null ? v.toFixed(1) : "no game"}</span>` },
  ],
  matchups: [
    { label: "Batter",      key: "batter" },
    { label: "Team",        key: "batter_team" },
    { label: "Slot",        key: "slot",
      fmt: (v, r) => slotBadge(r.slot, "slot-bat") },
    { label: "Opp Pitcher", key: "opp_pitcher",
      fmt: (v)    => v || `<span class="fpts-none">off day</span>` },
    { label: "MLB",         key: "pitcher_team" },
    { label: "Matchup",     key: "matchup",  fmt: v => v || "" },
    { label: "Opp FPTS",    key: "fpts",     cls: "num",
      fmt: (v)    => `<span class="${fptsCls(v)}">${v !== null ? v.toFixed(1) : "&#8212;"}</span>` },
    { label: "ERA",         key: "era",      cls: "num",
      fmt: (v)    => v !== null ? `<span class="${eraCls(v)}">${v.toFixed(2)}</span>` : "" },
  ],
};

// ── Render ───────────────────────────────────────────────────────────────────

function render(rows) {
  const cols   = COLS[activeTab];
  const thead  = document.getElementById("thead");
  const tbody  = document.getElementById("tbody");
  const footer = document.getElementById("footer");

  thead.innerHTML = "<tr>" + cols.map(c =>
    `<th class="${c.cls || ""}">${c.label}</th>`
  ).join("") + "</tr>";

  if (!rows.length) {
    const msg = activeTab === "matchups" ? "No games today." : "No upcoming starts.";
    tbody.innerHTML = `<tr><td colspan="99" class="msg">${msg}</td></tr>`;
    footer.textContent = "";
    return;
  }

  tbody.innerHTML = rows.map(row =>
    "<tr>" + cols.map(c => {
      const raw = row[c.key];
      const val = c.fmt ? c.fmt(raw, row) : (raw != null ? raw : "");
      return `<td class="${c.cls || ""}">${val}</td>`;
    }).join("") + "</tr>"
  ).join("");

  if (activeTab === "starts") {
    const total = rows.reduce((s, r) => s + (r.fpts || 0), 0);
    footer.textContent = rows.length + " starts · " + total.toFixed(1) + " projected FPTS";
  } else {
    const playing = rows.filter(r => r.fpts !== null).length;
    footer.textContent = playing + " of " + rows.length + " position players have a game today";
  }
}

// ── Load ─────────────────────────────────────────────────────────────────────

async function load() {
  const tab  = activeTab;
  const team = activeTeam;

  if (cache[tab][team]) { render(cache[tab][team]); return; }

  document.getElementById("tbody").innerHTML =
    "<tr><td colspan=\"99\" class=\"msg\">Loading&#8230;</td></tr>";
  document.getElementById("footer").textContent = "";

  try {
    const resp = await fetch("api.php?type=" + tab + "&team=" + encodeURIComponent(team));
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const data = await resp.json();
    if (data.error) throw new Error(data.error);
    cache[tab][team] = data;
    if (activeTab === tab && activeTeam === team) render(data);
  } catch (e) {
    document.getElementById("tbody").innerHTML =
      "<tr><td colspan=\"99\" class=\"msg err\">Error: " + e.message + "</td></tr>";
  }
}

// ── Fetch ESPN period label ───────────────────────────────────────────────────

fetch("api.php?type=meta")
  .then(function(r) { return r.json(); })
  .then(function(m) {
    if (m.pitcher_sync) document.getElementById("period").textContent = m.pitcher_sync;
  })
  .catch(function() {});

// ── Event listeners ───────────────────────────────────────────────────────────

document.querySelectorAll(".tab").forEach(function(t) {
  t.addEventListener("click", function() {
    if (t.dataset.tab === activeTab) return;
    activeTab = t.dataset.tab;
    document.querySelectorAll(".tab").forEach(function(x) { x.classList.remove("active"); });
    t.classList.add("active");
    load();
  });
});

document.getElementById("team-select").addEventListener("change", function() {
  activeTeam = this.value;
  if (OUR_TEAMS.indexOf(activeTeam) !== -1) setCookie("fantasy_team", activeTeam);
  load();
});

// Populate team dropdown from DB, then load data.
fetch("api.php?type=teams")
  .then(function(r) { return r.json(); })
  .then(function(teams) {
    const sel = document.getElementById("team-select");
    const ours   = teams.filter(function(t) { return OUR_TEAMS.indexOf(t.team_key) !== -1; });
    const others = teams.filter(function(t) { return OUR_TEAMS.indexOf(t.team_key) === -1; });

    function addGroup(label, list) {
      const g = document.createElement("optgroup");
      g.label = label;
      list.forEach(function(t) {
        const o = document.createElement("option");
        o.value = t.team_key;
        o.textContent = t.team_name;
        g.appendChild(o);
      });
      sel.appendChild(g);
    }
    addGroup("Our Teams", ours);
    addGroup("Other Teams", others);

    const saved = getCookie("fantasy_team");
    if (saved && OUR_TEAMS.indexOf(saved) !== -1) activeTeam = saved;
    sel.value = activeTeam;
    load();
  })
  .catch(function() { load(); });
</script>
</body>
</html>
