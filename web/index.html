<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fantasy Tools</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  font-size: 13px;
  background: #e8eaed;
  color: #202124;
  min-height: 100vh;
}

header {
  background: #1a73e8;
  color: #fff;
  padding: 10px 16px;
}
header h1 { font-size: 17px; font-weight: 600; }

.cards {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  padding: 24px 16px;
}

.card {
  background: #fff;
  border: 1px solid #dadce0;
  border-radius: 8px;
  padding: 20px 24px;
  width: 260px;
  text-decoration: none;
  color: inherit;
  transition: box-shadow 0.15s, border-color 0.15s;
}
.card:hover {
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  border-color: #1a73e8;
}
.card h2 { font-size: 15px; font-weight: 600; color: #1a73e8; margin-bottom: 6px; }
.card p  { font-size: 12px; color: #5f6368; line-height: 1.5; }
</style>
</head>
<body>

<header>
  <h1>Fantasy Tools</h1>
</header>

<div class="cards">
  <a class="card" href="players.html">
    <h2>Free Agent Browser</h2>
    <p>Filter and sort free agents by stats, position, and availability.</p>
  </a>
  <a class="card" href="lineup.html">
    <h2>Lineup Helper</h2>
    <p>ESPN FPTS projections for your pitchers and Helen's, side by side.</p>
  </a>
</div>

</body>
</html>
